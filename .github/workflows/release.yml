# Release: when a version tag (v0.1.0 and on) is pushed, the tests run
# once more and GoReleaser v2.18.2 builds the six downloads and publishes
# the release, the Homebrew cask, the winget pull request and the AUR
# package (the AUR is skipped until the AUR_KEY secret exists).
# The secrets are set up in specs/RELEASE_ACCOUNTS.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and upload the downloads

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, for the changelog
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
