# Install check: every way to install Quarter, on real machines, ends with
# typing quarter in a new terminal and getting the latest release. It runs
# after each release, when an install script changes, and by hand (Actions,
# install-check, Run workflow). It installs only on GitHub's machines and
# publishes nothing. winget is left out: Microsoft's own pipeline installs
# and checks every Quarter version when its pull request opens.
# Actions are pinned to full commit hashes, as in ci.yml.
name: install-check

on:
  workflow_dispatch:
  workflow_run:
    workflows: [release]
    types: [completed]
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/install-check.yml

permissions:
  contents: read

env:
  # To read the latest release's tag (the one every install must give)
  # from GitHub's API signed in, so its rate limit never gets in the way.
  GH_TOKEN: ${{ github.token }}

jobs:
  # The macOS and Linux script, for each shell new terminals open: the
  # script must put ~/.local/bin on the PATH in that shell's own settings.
  script-unix:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: bash }
          - { os: ubuntu-latest, shell: zsh }
          - { os: ubuntu-latest, shell: fish }
          - { os: ubuntu-latest, shell: sh }
          - { os: ubuntu-24.04-arm, shell: bash }
          - { os: macos-latest, shell: zsh }
          - { os: macos-latest, shell: bash }
          - { os: macos-15-intel, shell: zsh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the latest release's tag
        run: |
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          echo "$tag"; [ -n "$tag" ]
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: install the shell
        if: runner.os == 'Linux' && (matrix.shell == 'zsh' || matrix.shell == 'fish')
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.shell }}
      # The runners have ~/.local/bin on their PATH already; a new user doesn't.
      - name: install with the script, as a new user
        run: |
          env PATH=/usr/bin:/bin SHELL="$(command -v ${{ matrix.shell }})" sh ./install.sh | tee out.txt
          grep -q -e "Open a new terminal" -e "Log out and back in" out.txt
      - name: a new terminal finds quarter
        run: |
          case "${{ matrix.shell }}" in
            bash) if [ "$RUNNER_OS" = macOS ]; then new="bash -l -c"; else new="bash -i -c"; fi ;;
            zsh) new="zsh -i -c" ;;
            fish) new="fish -c" ;;
            sh) new="sh -l -c" ;;
          esac
          got=$(env -i HOME="$HOME" TERM=dumb PATH=/usr/bin:/bin $new 'quarter --version')
          echo "$got"
          [ "$got" = "quarter $TAG" ]
      - name: installing again adds nothing twice
        run: |
          env PATH=/usr/bin:/bin SHELL="$(command -v ${{ matrix.shell }})" sh ./install.sh
          n=$(cat ~/.zshrc ~/.bashrc ~/.bash_profile ~/.bash_login ~/.profile ~/.config/fish/conf.d/quarter.fish 2>/dev/null | grep -c "# Quarter (https://github.com/stronxyo/quarter)" || true)
          echo "settings lines: $n"
          [ "$n" = 1 ]
      # No Steam on these machines: Quarter should say so, not crash.
      - name: the program runs
        run: |
          out=$(~/.local/bin/quarter --list 2>&1) && code=0 || code=$?
          echo "$out"; echo "exit $code"
          case "$out" in *panic*) exit 1 ;; esac
          [ "$code" -le 1 ]

  # The Windows script, in Windows PowerShell 5.1 and PowerShell 7, on x64
  # and ARM: quarter works in the same window and in a new one.
  script-windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        shell: [powershell, pwsh]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the latest release's tag
        run: |
          $tag = (Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }).tag_name
          $tag
          if (-not $tag) { exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "TAG=$tag"
      - name: install with the script; quarter works in the same window
        run: |
          Get-Content -Raw ./install.ps1 | Invoke-Expression
          (Get-Command quarter).Source
          $got = quarter --version
          $got
          if ($got -ne "quarter $env:TAG") { exit 1 }
      - name: a new terminal finds quarter
        run: |
          # A new terminal's PATH: the machine's and the user's, as Windows keeps them.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          (Get-Command quarter).Source
          $got = quarter --version
          $got
          if ($got -ne "quarter $env:TAG") { exit 1 }
      # No Steam on these machines: Quarter should say so, not crash.
      - name: the program runs
        run: |
          $ErrorActionPreference = 'Continue' # its message on stderr isn't a failure here
          $out = quarter --list 2>&1 | Out-String
          $code = $LASTEXITCODE
          $out
          "exit $code"
          if ($code -gt 1 -or $out -match 'panic') { exit 1 }
          exit 0

  # brew install stronxyo/tap/quarter on macOS (Apple and Intel) and Linux.
  brew:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: brew install, then quarter
        run: |
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew install stronxyo/tap/quarter
          command -v quarter
          got=$(quarter --version)
          echo "$got"
          [ "$got" = "quarter $tag" ]

  # go install ...@latest: it builds and runs. Releases up to v0.2.0 print
  # "dev" here (fixed after it), so that is a warning, not a failure.
  go-install:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: go install, then quarter
        run: |
          $tag = (Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }).tag_name
          go install github.com/stronxyo/quarter/cmd/quarter@latest
          $exe = Join-Path (go env GOPATH) 'bin' ($IsWindows ? 'quarter.exe' : 'quarter')
          $got = & $exe --version
          $got
          if ($got -eq 'quarter dev') { Write-Output "::warning::go install's quarter --version says dev" }
          elseif ($got -ne "quarter $tag") { exit 1 }
